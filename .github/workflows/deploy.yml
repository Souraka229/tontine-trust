name: Deploy HACKBIT

on:
  push:
    branches: [hack-winner]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_KKIAPAY_BASE_URL: ${{ secrets.VITE_KKIAPAY_BASE_URL }}
          VITE_KKIAPAY_PUBLIC_KEY: ${{ secrets.VITE_KKIAPAY_PUBLIC_KEY }}
          VITE_KKIAPAY_PRIVATE_KEY: ${{ secrets.VITE_KKIAPAY_PRIVATE_KEY }}
          VITE_KKIAPAY_SECRET: ${{ secrets.VITE_KKIAPAY_SECRET }}
          VITE_KKIAPAY_SANDBOX: ${{ secrets.VITE_KKIAPAY_SANDBOX }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_DEMO_PAYMENTS: ${{ secrets.VITE_DEMO_PAYMENTS }}
          VITE_WHATSAPP_BOT_NUMBER: ${{ secrets.VITE_WHATSAPP_BOT_NUMBER }}
          VITE_WHATSAPP_BOT_LABEL: ${{ secrets.VITE_WHATSAPP_BOT_LABEL }}
          VITE_LNBITS_ENABLED: ${{ secrets.VITE_LNBITS_ENABLED }}
          VITE_LNBITS_URL: ${{ secrets.VITE_LNBITS_URL }}
          GITHUB_PAGES: "true"
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
